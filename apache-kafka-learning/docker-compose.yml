services:
  kafka:
    image: confluentinc/cp-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: CONTROLLER://kafka:29092,INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://[IP_ADDRESS],CONTROLLER://[IP_ADDRESS],INTERNAL://[IP_ADDRESS],EXTERNAL://[IP_ADDRESS]
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29092
      